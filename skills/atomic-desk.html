<title>原子寫作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes on desktop (筆記庫 | 編輯 | 預覽), tabbed single pane on phones. Four callout colors carry meaning everywhere. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunken:#eef1f7; --ink:#17213a; --muted:#5d6782; --line:#d8deea;
  --navy:#1f3260; --navy-ink:#ffffff; --focus:#3b6fd8;
  --c-view:#2f73c0; --c-view-bg:#e7f1fc;
  --c-src:#7b5fcf; --c-src-bg:#f0ebfc;
  --c-ex:#2b9470; --c-ex-bg:#e4f5ee;
  --c-q:#d9772f; --c-q-bg:#fdf0e5;
  --ok:#2b9470; --warn:#c2621b; --err:#c23b3b;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162a; --surface:#18203a; --sunken:#121a30; --ink:#e6ebf7; --muted:#9aa5c3; --line:#2b3758;
    --navy:#3a58a8; --navy-ink:#ffffff; --focus:#7aa4ff;
    --c-view:#78b4f0; --c-view-bg:#16304d; --c-src:#ac97f2; --c-src-bg:#272149;
    --c-ex:#62cfa5; --c-ex-bg:#11352a; --c-q:#f2a46a; --c-q-bg:#3b2617;
    --ok:#62cfa5; --warn:#f2a46a; --err:#f08585; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10162a; --surface:#18203a; --sunken:#121a30; --ink:#e6ebf7; --muted:#9aa5c3; --line:#2b3758;
  --navy:#3a58a8; --navy-ink:#ffffff; --focus:#7aa4ff;
  --c-view:#78b4f0; --c-view-bg:#16304d; --c-src:#ac97f2; --c-src-bg:#272149;
  --c-ex:#62cfa5; --c-ex-bg:#11352a; --c-q:#f2a46a; --c-q-bg:#3b2617;
  --ok:#62cfa5; --warn:#f2a46a; --err:#f08585; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.shell{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.55rem;margin:0;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:.85rem}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.pane h2 .seg button{font-family:var(--f-body);font-size:.8rem;padding:4px 12px}
.status{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

.tabs{display:none}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.pane > h2{font-family:var(--f-display);font-size:1.02rem;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.pane-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}

/* library */
.lib-search{width:100%}
.lib-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow:auto}
.lib-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:var(--sunken);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.lib-item:hover{border-color:var(--line)}
.lib-item.active{border-color:var(--navy);background:var(--surface)}
.lib-item b{display:block;font-size:.9rem;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.lib-item small{color:var(--muted);font-size:.74rem;display:flex;gap:6px;align-items:center;margin-top:2px}
.pill{display:inline-block;font-size:.7rem;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.drive{border-color:var(--ok);color:var(--ok)}
.empty{color:var(--muted);font-size:.86rem;background:var(--sunken);border-radius:8px;padding:12px}

/* form */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],textarea,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.block{border-left:4px solid var(--c);background:var(--cbg);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.block .lbl{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.88rem;color:var(--c)}
.block .lbl em{font-style:normal;font-weight:400;color:var(--muted);font-size:.76rem}
.block textarea,.block input{background:var(--surface)}
.k-view{--c:var(--c-view);--cbg:var(--c-view-bg)} .k-src{--c:var(--c-src);--cbg:var(--c-src-bg)}
.k-ex{--c:var(--c-ex);--cbg:var(--c-ex-bg)} .k-q{--c:var(--c-q);--cbg:var(--c-q-bg)}
details.transcribe{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--sunken)}
details.transcribe summary{cursor:pointer;font-weight:700;font-size:.9rem}
.para-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.para{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.para p{margin:0 0 6px;overflow-wrap:anywhere}
.para .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--c);color:var(--c);background:var(--cbg);border-radius:999px;font:inherit;font-size:.76rem;padding:2px 10px;cursor:pointer}
.para.done{opacity:.5}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--sunken)}
.sec-head{display:flex;gap:6px}
.btn{font:inherit;font-size:.88rem;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{font-size:.78rem;padding:4px 10px}

/* progress through the writing flow */
.flow{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;font-size:.76rem}
.flow span{padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.flow span.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.flow i{width:10px;height:1px;background:var(--line)}
.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--c-q-bg);border:1px solid var(--c-q);border-radius:8px;padding:8px 12px;font-size:.84rem}

/* preview */
.pv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-file{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.doc{font-size:.95rem;max-width:68ch}
.doc .fm{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);background:var(--sunken);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}
.doc h1{font-family:var(--f-display);font-size:1.4rem;line-height:1.35;margin:0 0 12px;text-wrap:balance}
.doc h2{font-family:var(--f-display);font-size:1.08rem;margin:18px 0 6px}
.doc p{margin:0 0 10px;white-space:pre-wrap}
.doc .co{border-left:4px solid var(--c);background:var(--cbg);border-radius:0 8px 8px 0;padding:8px 12px;margin:0 0 10px}
.doc .co b{color:var(--c);font-size:.86rem;display:block;margin-bottom:2px}
.doc .co div{white-space:pre-wrap}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc .wl{color:var(--c-src);text-decoration:underline dotted}
pre.md{font-family:var(--f-mono);font-size:.8rem;line-height:1.55;background:var(--sunken);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:70vh;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding:12px 16px}
.msg{font-size:.84rem;padding:8px 12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.msg.ok{border-color:var(--ok)} .msg.err{border-color:var(--err)} .msg.warn{border-color:var(--warn)}
.msg a{color:var(--focus)}
.confirm{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--err)}

@media (max-width:1100px){
  .grid{grid-template-columns:220px minmax(0,1fr)}
  #pane-preview{grid-column:1/-1}
}
@media (max-width:760px){
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .pane{display:none}
  .pane.show{display:block}
  .row2{grid-template-columns:1fr}
  .lib-list{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand"><h1>原子寫作台</h1><span>記錄 → 轉寫 → 存進 Obsidian</span></div>
    <div class="seg" role="group" aria-label="寫作模式">
      <button id="mode-note" aria-pressed="true">原子筆記</button>
      <button id="mode-essay" aria-pressed="false">Atomic Essay</button>
    </div>
    <div class="status"><span class="dot" id="db-dot"></span><span id="db-status">連線筆記庫中…</span></div>
  </header>

  <div class="tabs seg" role="group" aria-label="切換畫面">
    <button data-tab="pane-lib" aria-pressed="false">筆記庫</button>
    <button data-tab="pane-edit" aria-pressed="true">編輯</button>
    <button data-tab="pane-preview" aria-pressed="false">預覽與存檔</button>
  </div>

  <div class="grid">
    <!-- library -->
    <section class="pane" id="pane-lib">
      <h2>筆記庫 <button class="btn sm" id="new-btn">＋ 新筆記</button></h2>
      <div class="pane-body">
        <input type="text" id="lib-search" class="lib-search" placeholder="搜尋標題或標籤" aria-label="搜尋筆記">
        <ul class="lib-list" id="lib-list"></ul>
      </div>
    </section>

    <!-- editor -->
    <section class="pane show" id="pane-edit">
      <h2><span id="edit-title">原子筆記</span><button class="btn ghost sm" id="clear-btn">清空</button></h2>
      <div class="pane-body" id="editor"></div>
    </section>

    <!-- preview -->
    <section class="pane" id="pane-preview">
      <h2>預覽
        <span class="seg" role="group" aria-label="預覽方式">
          <button id="pv-render" aria-pressed="true">Obsidian 樣式</button>
          <button id="pv-md" aria-pressed="false">Markdown</button>
        </span>
      </h2>
      <div class="pane-body">
        <div class="pv-file" id="pv-file"></div>
        <div id="pv-out"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="save-db">存到筆記庫</button>
        <button class="btn" id="save-drive">存到 Google Drive</button>
        <button class="btn" id="copy-md">複製 Markdown</button>
        <button class="btn" id="dl-md" hidden>下載 .md</button>
      </div>
      <div class="pane-body" style="padding-top:0"><div id="msg" class="msg" hidden></div></div>
    </section>
  </div>
</div>

<script>
(() => {
/* ---------- state ---------- */
const SAMPLE = {
  mode:'note', title:'AI 降低了工具門檻，但沒有降低思考門檻', tags:'AI寫作, 寫作工作流', source:'@chihua.wang.3 資訊圖', status:'收件匣',
  view:'工具越方便，越需要刻意練習理解與驗證。', src:'「AI 讓編輯器、排版與匯出變得容易，卻沒有替人完成思考。」', srcFrom:'@chihua.wang.3 資訊圖',
  ex:'用 Claude 幾分鐘就做出寫作編輯器，但文章的核心觀點仍要自己想清楚。', q:'在我的教學裡，哪個環節最不該交給 AI？', links:'AI 協作寫作, Atomic Essay', think:'什麼樣的作業設計能讓 AI 成為思考的起點？',
  question:'', audience:'', core:'', sections:[{h:'',body:''}], concl:'', weak:'', counter:'', verify:'', sources:'', raw:'', isSample:true
};
const blank = () => ({mode:cur.mode||'note', title:'', tags:'', source:'', status:'收件匣', view:'', src:'', srcFrom:'', ex:'', q:'', links:'', think:'',
  question:'', audience:'', core:'', sections:[{h:'',body:''},{h:'',body:''}], concl:'', weak:'', counter:'', verify:'', sources:'', raw:''});
let cur = {};
let curId = null;          // db doc id of the loaded note
let curMeta = {};          // {driveUrl, created}
let notes = [];            // library
let pvMode = 'render';
const LS = 'atomic-desk-draft-v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const draft = lsGet(LS);
if (draft && draft.cur) { cur = draft.cur; curId = draft.curId||null; curMeta = draft.curMeta||{}; } else { cur = {...SAMPLE}; }

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const list = s => String(s||'').split(/[,，、\n]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean);

/* ---------- markdown ---------- */
function quote(type, label, text){
  const lines = String(text).trim().split('\n');
  return `> [!${type}] ${label}\n` + lines.map(l=>'> '+l).join('\n') + '\n';
}
function fileName(){
  const t = (cur.title||'未命名').replace(/[\/\\:*?"<>|#^\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
  return `${curMeta.created||today()} ${t}.md`;
}
function toMarkdown(){
  const tags = list(cur.tags).map(t=>t.replace(/\s+/g,'-'));
  const out = [];
  if (cur.mode === 'note'){
    out.push('---','type: note',`created: ${curMeta.created||today()}`,`tags: [${tags.join(', ')}]`,`source: ${cur.source||'個人想法'}`,`status: ${cur.status||'收件匣'}`,'---');
    out.push(`# ${cur.title||'未命名'}`,'');
    if (cur.view.trim()) out.push(quote('info','觀點',cur.view));
    if (cur.src.trim()) out.push(quote('example','素材',cur.src + `\n來源：${cur.srcFrom.trim()||'待補'}`));
    if (cur.ex.trim()) out.push(quote('tip','例子',cur.ex));
    if (cur.q.trim()) out.push(quote('question','疑問',cur.q));
    const links = list(cur.links);
    if (links.length || cur.think.trim()){
      out.push('## 下一步');
      if (links.length) out.push('- 可連結：' + links.map(l=>`[[${l}]]`).join('、'));
      if (cur.think.trim()) out.push('- 想一想：' + cur.think.trim());
    }
  } else {
    const srcs = list(cur.sources);
    out.push('---','type: atomic-essay',`created: ${curMeta.created||today()}`,`tags: [${tags.join(', ')}]`,`question: ${cur.question||''}`,`audience: ${cur.audience||''}`,
      `sources: [${srcs.map(s=>`"[[${s}]]"`).join(', ')}]`,'status: 草稿','---');
    out.push(`# ${cur.title||'未命名'}`,'');
    if (cur.core.trim()) out.push(quote('info','核心觀點',cur.core));
    cur.sections.forEach(s => { if (s.h.trim()||s.body.trim()){ out.push(`## ${s.h.trim()||'（小標題）'}`, s.body.trim(), ''); } });
    if (cur.src.trim()) out.push(quote('example','素材',cur.src + `\n來源：${cur.srcFrom.trim()||'待補'}`));
    out.push(quote('tip','例子', cur.ex.trim() || '放一個你自己的經驗'));
    if (cur.concl.trim()) out.push('## 結論', cur.concl.trim(), '');
    out.push('---','','## 驗證清單');
    out.push(quote('question','待你確認', `- 最弱的論證：${cur.weak.trim()||'（待填）'}\n- 可能的反例：${cur.counter.trim()||'（待填）'}\n- 需要查證：${cur.verify.trim()||'（待填）'}`));
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim() + '\n';
}

/* ---------- editor ---------- */
const field = (key, label, ph, tag='input', rows=3) => tag==='input'
  ? `<label class="f">${label}<input type="text" id="f-${key}" data-k="${key}" value="${esc(cur[key])}" placeholder="${esc(ph)}"></label>`
  : `<label class="f">${label}<textarea id="f-${key}" data-k="${key}" rows="${rows}" placeholder="${esc(ph)}">${esc(cur[key])}</textarea></label>`;
const block = (cls, key, label, hint, ph, extra='') => `<div class="block ${cls}"><div class="lbl">${label}<em>${hint}</em></div>
  <textarea id="f-${key}" data-k="${key}" rows="3" placeholder="${esc(ph)}" aria-label="${label}">${esc(cur[key])}</textarea>${extra}</div>`;

function flowSteps(){
  if (cur.mode==='note') return [['記錄',!!cur.title.trim()],['四色分類',!!(cur.view||cur.src||cur.ex||cur.q).trim()],['觀點',!!cur.view.trim()],['疑問',!!cur.q.trim()],['連結',!!list(cur.links).length]];
  return [['需求',!!cur.question.trim()],['核心觀點',!!cur.core.trim()],['小標題',cur.sections.some(s=>s.h.trim())],['正文',cur.sections.some(s=>s.body.trim())],['結論',!!cur.concl.trim()],['驗證',!!(cur.weak.trim()&&cur.counter.trim())],['例子',!!cur.ex.trim()]];
}
function renderFlow(){
  const el = $('#flow'); if (!el) return;
  el.innerHTML = flowSteps().map(([n,on],i)=>(i?'<i></i>':'')+`<span class="${on?'on':''}">${n}</span>`).join('');
}

function renderEditor(){
  $('#edit-title').textContent = cur.mode==='note' ? '原子筆記' : 'Atomic Essay';
  $('#mode-note').setAttribute('aria-pressed', cur.mode==='note');
  $('#mode-essay').setAttribute('aria-pressed', cur.mode==='essay');
  const sampleBar = cur.isSample ? `<div class="sample"><span>這是範例草稿，示範四色分類的寫法。</span><button class="btn sm" id="start-blank">清空開始寫</button></div>` : '';
  const transcribe = `<details class="transcribe" ${cur.raw?'open':''}><summary>轉寫：貼上原始文字，逐段分類</summary>
    <label class="f" style="margin-top:8px">課堂、閱讀、會議或錄音逐字稿<textarea id="f-raw" data-k="raw" rows="4" placeholder="貼上一大段文字，按「拆成段落」後，把每段放進觀點、素材、例子或疑問。">${esc(cur.raw)}</textarea></label>
    <div style="margin-top:8px"><button class="btn sm" id="split-btn">拆成段落</button></div><ul class="para-list" id="para-list"></ul></details>`;
  let h = sampleBar + `<div class="flow" id="flow" aria-label="寫作進度"></div>` + transcribe;
  if (cur.mode==='note'){
    h += field('title','標題（寫成一句完整的主張或問題）','例：工具越方便，越容易讓人跳過思考');
    h += `<div class="row2">${field('tags','標籤（用逗號分隔）','AI寫作, 教學')}${field('source','來源','書名、網址、課堂；沒有就留空')}</div>`;
    h += `<label class="f">存放位置<select id="f-status" data-k="status"><option ${cur.status==='收件匣'?'selected':''}>收件匣</option><option ${cur.status==='原子筆記'?'selected':''}>原子筆記</option></select></label>`;
    h += block('k-view','view','觀點','你自己的主張','只寫你自己同意、說得出理由的話');
    h += block('k-src','src','素材','引文、數據、他人說法','貼上引文或數據',`<input type="text" id="f-srcFrom" data-k="srcFrom" value="${esc(cur.srcFrom)}" placeholder="素材出處（不知道就留空，會標「待補」）" aria-label="素材出處">`);
    h += block('k-ex','ex','例子','具體案例或親身經驗','一個你遇過的真實情境');
    h += block('k-q','q','疑問','還沒想清楚、待查證','你想追問的問題');
    h += `<div class="row2">${field('links','可連結的主題','AI 協作寫作, 作業設計')}${field('think','想一想','一個推進思考的問題')}</div>`;
  } else {
    h += field('title','標題','一句話說出這篇的主張');
    h += `<div class="row2">${field('question','需求：這篇要回答什麼問題','例：AI 時代還需要練寫作嗎？')}${field('audience','寫給誰','例：大一新生')}</div>`;
    h += field('tags','標籤','AI寫作, 教學');
    h += block('k-view','core','核心觀點','一句話，必須是你的話','這篇文章只講一件事：…');
    h += `<div class="f" style="font-size:.82rem;color:var(--muted);font-weight:500">小標題與正文</div><div id="secs" style="display:flex;flex-direction:column;gap:8px">` +
      cur.sections.map((s,i)=>`<div class="sec"><div class="sec-head"><input type="text" id="sec-h-${i}" data-s="${i}" data-sk="h" value="${esc(s.h)}" placeholder="小標題 ${i+1}" aria-label="小標題 ${i+1}">
      <button class="btn ghost sm" data-del="${i}" aria-label="刪除第 ${i+1} 段" ${cur.sections.length<2?'disabled':''}>刪除</button></div>
      <textarea id="sec-b-${i}" data-s="${i}" data-sk="body" rows="4" placeholder="展開論述與分析" aria-label="第 ${i+1} 段正文">${esc(s.body)}</textarea></div>`).join('') +
      `</div><div><button class="btn sm" id="add-sec" ${cur.sections.length>=4?'disabled':''}>＋ 新增小標題</button></div>`;
    h += block('k-src','src','素材','支持論述的證據','引文或數據',`<input type="text" id="f-srcFrom" data-k="srcFrom" value="${esc(cur.srcFrom)}" placeholder="素材出處" aria-label="素材出處">`);
    h += block('k-ex','ex','例子','至少一個','用你自己的經驗讓觀點落地');
    h += field('concl','結論：回到開頭的問題，所以呢？','','textarea',3);
    h += `<div class="block k-q"><div class="lbl">驗證清單<em>這一步要自己來</em></div>
      <input type="text" id="f-weak" data-k="weak" value="${esc(cur.weak)}" placeholder="最弱的論證是哪一句？為什麼？" aria-label="最弱的論證">
      <input type="text" id="f-counter" data-k="counter" value="${esc(cur.counter)}" placeholder="可能的反例或反方觀點" aria-label="可能的反例">
      <input type="text" id="f-verify" data-k="verify" value="${esc(cur.verify)}" placeholder="需要查證的事實或引用" aria-label="需要查證"></div>`;
    h += field('sources','引用的原子筆記（標題，用逗號分隔；可從筆記庫點「引用」加入）','AI 降低了工具門檻，但沒有降低思考門檻');
  }
  $('#editor').innerHTML = h;
  renderFlow(); renderParas();
}

let paras = [];
function renderParas(){
  const ul = $('#para-list'); if (!ul) return;
  const kinds = [['view','觀點','k-view'],['src','素材','k-src'],['ex','例子','k-ex'],['q','疑問','k-q']];
  ul.innerHTML = paras.map((p,i)=>`<li class="para ${p.done?'done':''}"><p>${esc(p.t)}</p><div class="chips">${kinds.map(([k,n,c])=>`<button class="chip ${c}" data-pi="${i}" data-pk="${k}">→ ${n}</button>`).join('')}${cur.mode==='essay'?`<button class="chip k-view" data-pi="${i}" data-pk="sec">→ 正文</button>`:''}</div></li>`).join('');
}

/* ---------- preview ---------- */
function renderPreview(){
  const md = toMarkdown();
  const folder = cur.mode==='essay' ? '20 文章' : (cur.status==='原子筆記' ? '10 原子筆記' : '00 收件匣');
  $('#pv-file').textContent = `Obsidian/${folder}/${fileName()}`;
  $('#pv-render').setAttribute('aria-pressed', pvMode==='render'); $('#pv-md').setAttribute('aria-pressed', pvMode==='md');
  if (pvMode==='md'){ $('#pv-out').innerHTML = `<pre class="md" id="md-pre">${esc(md)}</pre>`; return; }
  // render Obsidian-like view from the markdown
  const [ , fm, body] = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/) || [null,'',md];
  const typeMap = {info:'k-view',example:'k-src',tip:'k-ex',question:'k-q'};
  const wl = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="wl">$1</span>');
  let html = `<div class="fm">${esc(fm)}</div>`, lines = body.split('\n'), i=0;
  while (i<lines.length){
    const l = lines[i];
    let m;
    if ((m = l.match(/^> \[!(\w+)\] (.*)$/))){
      const buf=[]; i++; while(i<lines.length && lines[i].startsWith('> ')){ buf.push(lines[i].slice(2)); i++; }
      html += `<div class="co ${typeMap[m[1]]||''}"><b>${esc(m[2])}</b><div>${wl(buf.join('\n'))}</div></div>`; continue;
    }
    if (l.startsWith('# ')) html += `<h1>${wl(l.slice(2))}</h1>`;
    else if (l.startsWith('## ')) html += `<h2>${wl(l.slice(3))}</h2>`;
    else if (l.startsWith('- ')){ const buf=[]; while(i<lines.length && lines[i].startsWith('- ')){ buf.push(`<li>${wl(lines[i].slice(2))}</li>`); i++; } html += `<ul>${buf.join('')}</ul>`; continue; }
    else if (l==='---') html += '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">';
    else if (l.trim()) html += `<p>${wl(l)}</p>`;
    i++;
  }
  $('#pv-out').innerHTML = `<article class="doc">${html}</article>`;
}

/* ---------- library ---------- */
function renderLib(){
  const q = $('#lib-search').value.trim().toLowerCase();
  const shown = notes.filter(n => !q || (n.title+' '+n.tags).toLowerCase().includes(q));
  const ul = $('#lib-list');
  if (!notes.length){ ul.innerHTML = `<li class="empty">${libReady ? '還沒有存過筆記。寫好後按「存到筆記庫」，就會出現在這裡，之後可以點開繼續修改。' : '正在讀取你的筆記…'}</li>`; return; }
  if (!shown.length){ ul.innerHTML = `<li class="empty">找不到符合「${esc(q)}」的筆記。</li>`; return; }
  ul.innerHTML = shown.map(n=>`<li><button class="lib-item ${n.id===curId?'active':''}" data-id="${esc(n.id)}"><b>${esc(n.title||'未命名')}</b>
    <small><span class="pill">${n.mode==='essay'?'文章':'筆記'}</span>${n.driveUrl?'<span class="pill drive">已存 Drive</span>':''}<span>${esc((n.updatedAt||'').slice(0,10))}</span></small></button>
    ${cur.mode==='essay' && n.mode==='note' && n.id!==curId ? `<button class="btn ghost sm" data-cite="${esc(n.id)}">引用到文章</button>`:''}
    ${n.id===curId ? `<span class="confirm" id="del-area"><button class="btn ghost sm" id="del-btn">刪除這則</button></span>`:''}</li>`).join('');
}

/* ---------- sync ---------- */
let saveT;
function changed(){
  if (cur.isSample) { delete cur.isSample; const b=document.querySelector('.sample'); if (b) b.remove(); }
  lsSet(LS,{cur,curId,curMeta}); renderFlow();
  clearTimeout(saveT); saveT = setTimeout(renderPreview, 150);
}
function msg(text, kind='', html=false){ const m=$('#msg'); m.hidden=false; m.className='msg '+kind; if (html) m.innerHTML=text; else m.textContent=text; }
function load(state, id, meta){ cur = state; curId = id; curMeta = meta||{}; paras=[]; renderEditor(); renderPreview(); renderLib(); lsSet(LS,{cur,curId,curMeta}); $('#msg').hidden=true; }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k){ cur[t.dataset.k] = t.value; changed(); }
  else if (t.dataset.s!==undefined){ cur.sections[+t.dataset.s][t.dataset.sk] = t.value; changed(); }
  else if (t.id==='lib-search') renderLib();
});
document.addEventListener('change', e => { if (e.target.id==='f-status'){ cur.status=e.target.value; changed(); } });
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id==='mode-note' || b.id==='mode-essay'){ cur.mode = b.id==='mode-note'?'note':'essay'; if(!cur.sections) cur.sections=[{h:'',body:''}]; renderEditor(); changed(); renderLib(); }
  else if (b.id==='start-blank' || b.id==='clear-btn'){ if (b.id==='clear-btn' && !b.dataset.sure){ b.dataset.sure='1'; b.textContent='確定清空？'; setTimeout(()=>{b.textContent='清空';delete b.dataset.sure;},3000); return; } load(blank(), null, {}); }
  else if (b.id==='new-btn'){ load(blank(), null, {}); showTab('pane-edit'); }
  else if (b.id==='split-btn'){ paras = (cur.raw||'').split(/\n\s*\n|\n(?=[-•・●\d]+[.、)]?\s)/).map(s=>s.trim()).filter(Boolean).map(t=>({t})); if(!paras.length) paras = (cur.raw||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t})); renderParas(); }
  else if (b.dataset.pi!==undefined){
    const p = paras[+b.dataset.pi], k = b.dataset.pk;
    if (k==='sec'){ const s = cur.sections.find(s=>!s.body.trim()) || cur.sections[cur.sections.length-1]; s.body = (s.body?s.body+'\n':'') + p.t; }
    else cur[k] = (cur[k].trim()?cur[k].trim()+'\n':'') + p.t;
    p.done = true; const keep = paras; renderEditor(); paras = keep; renderParas(); changed();
  }
  else if (b.id==='add-sec'){ cur.sections.push({h:'',body:''}); renderEditor(); changed(); }
  else if (b.dataset.del!==undefined){ cur.sections.splice(+b.dataset.del,1); renderEditor(); changed(); }
  else if (b.id==='pv-render' || b.id==='pv-md'){ pvMode = b.id==='pv-md'?'md':'render'; renderPreview(); }
  else if (b.dataset.tab){ showTab(b.dataset.tab); }
  else if (b.classList.contains('lib-item')){ const n = notes.find(n=>n.id===b.dataset.id); if (n) { load(JSON.parse(n.state), n.id, {created:n.created, driveUrl:n.driveUrl}); showTab('pane-edit'); } }
  else if (b.dataset.cite){ const n = notes.find(n=>n.id===b.dataset.cite); if (n){ const l = list(cur.sources); if(!l.includes(n.title)) l.push(n.title); cur.sources = l.join(', '); const f=$('#f-sources'); if (f) f.value=cur.sources; changed(); } }
  else if (b.id==='del-btn'){ if (!b.dataset.sure){ b.dataset.sure='1'; b.textContent='確定從筆記庫刪除'; return; } await removeNote(); }
  else if (b.id==='copy-md'){ copyMd(); }
  else if (b.id==='save-db'){ await saveDb(); }
  else if (b.id==='save-drive'){ await saveDrive(b); }
  else if (b.id==='dl-md'){ await download(); }
});
function showTab(id){ document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('show', p.id===id)); document.querySelectorAll('.tabs button').forEach(t=>t.setAttribute('aria-pressed', t.dataset.tab===id)); }

async function copyMd(){
  const md = toMarkdown();
  try { await navigator.clipboard.writeText(md); msg('已複製 Markdown。到 Obsidian 新增筆記後貼上即可。','ok'); }
  catch { pvMode='md'; renderPreview(); const r=document.createRange(); r.selectNodeContents($('#md-pre')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg('這個畫面不允許自動複製，已幫你選取 Markdown，請按 Ctrl+C（Mac：⌘+C）。','warn'); }
}

/* db */
let db=null, user=null, coll=null, libReady=false, localMode=false;
const LIB = 'atomic-desk-library-v1';
function setStatus(t, kind){ $('#db-status').textContent=t; $('#db-dot').className='dot '+(kind||''); }
async function initDb(){
  try { db = await window.claude?.use?.('db'); user = await window.claude?.use?.('user'); } catch { db = null; }
  const uid = db && user ? await user.id().catch(()=>null) : null;
  if (!db || !uid){ localMode = true; notes = lsGet(LIB)||[]; libReady=true; setStatus('筆記庫只存在這個瀏覽器','warn'); renderLib(); return; }
  coll = db.collection('data/users/'+uid+'/notes');
  const timer = setTimeout(()=>{ if(!libReady){ setStatus('筆記庫讀取較慢，可先繼續寫','warn'); } }, 10000);
  coll.orderBy('updatedAt','desc').onSnapshot(snap => {
    clearTimeout(timer); libReady=true; notes = snap.docs.map(d=>({id:d.id, ...d.data()})); setStatus('筆記庫已同步','ok'); renderLib();
  }, err => { clearTimeout(timer); libReady=true; setStatus('筆記庫無法讀取：'+(err.code||''),'warn'); renderLib(); });
}
function record(){ return { title: cur.title||'未命名', tags: cur.tags||'', mode: cur.mode, created: curMeta.created||today(), updatedAt: new Date().toISOString(), driveUrl: curMeta.driveUrl||'', state: JSON.stringify({...cur, isSample:undefined}) }; }
async function saveDb(quiet){
  if (!cur.title.trim()){ msg('請先寫標題，筆記庫才能用標題找到它。','warn'); $('#f-title')?.focus(); showTab('pane-edit'); return; }
  curMeta.created = curMeta.created || today();
  const rec = record();
  try {
    if (localMode){ curId = curId || 'n'+Date.now(); notes = [{id:curId,...rec}, ...notes.filter(n=>n.id!==curId)]; lsSet(LIB, notes); renderLib(); }
    else { if (curId) await coll.doc(curId).set(rec); else { const ref = await coll.add(rec); curId = ref.id; } }
    lsSet(LS,{cur,curId,curMeta}); if(!quiet) msg('已存到筆記庫。之後在左側點標題就能繼續修改。','ok'); renderLib(); return true;
  } catch(e){ if (quiet) return false; msg('沒有存成功（'+(e.code||'錯誤')+'）。內容還在畫面上，請稍後再按一次。','err'); }
}
async function removeNote(){
  try { if (localMode){ notes = notes.filter(n=>n.id!==curId); lsSet(LIB,notes); } else await coll.doc(curId).delete(); load(blank(), null, {}); msg('已從筆記庫刪除。Google Drive 上的檔案不受影響。','ok'); }
  catch(e){ msg('刪除失敗（'+(e.code||'錯誤')+'）。','err'); }
}

/* Google Drive */
let mcp=null; const DRIVE='Google Drive'; const FKEY='atomic-desk-folders-v1';
const FOLDER_MIME='application/vnd.google-apps.folder';
function findFiles(payload){
  // payload shape varies; collect objects that look like Drive files
  const out=[]; const walk=v=>{ if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==='object'){ if(typeof v.id==='string'&&(v.title||v.name)) out.push(v); else Object.values(v).forEach(walk);} };
  walk(payload); return out;
}
async function findFolder(name, parentId){
  const q = `title = '${name.replace(/'/g,"\\'")}' and mimeType = '${FOLDER_MIME}' and trashed = false` + (parentId?` and parentId = '${parentId}'`:'');
  const r = await mcp.callTool(DRIVE,'search_files',{query:q, excludeContentSnippets:true, pageSize:5},{cache:false});
  return findFiles(r.payload).find(f=>(f.title||f.name)===name);
}
async function ensureFolder(name, parentId){
  const f = await findFolder(name, parentId); if (f) return f.id;
  const r = await mcp.callTool(DRIVE,'create_file',{title:name, contentMimeType:FOLDER_MIME, parentId: parentId||'root'});
  return (r.payload && r.payload.id) || findFiles(r.payload)[0]?.id;
}
async function folderIdFor(sub){
  const cache = lsGet(FKEY)||{};
  if (cache[sub]) return cache[sub];
  const root = cache.root || await ensureFolder('Obsidian', 'root');
  const id = await ensureFolder(sub, root);
  lsSet(FKEY, {...cache, root, [sub]:id}); return id;
}
function driveErr(e){
  const c = e && e.code;
  const map = {
    needs_reauth:'Google Drive 的授權過期了。請到 claude.ai「設定 → 連接器」重新連接 Google Drive，再按一次「存到 Google Drive」。',
    server_not_connected:'你還沒在 claude.ai 連接 Google Drive。請到「設定 → 連接器」加入 Google Drive 後再試。',
    selection_required:'你有多個 Google Drive 連接，請在 claude.ai 跳出的視窗選一個，再按一次。',
    not_in_manifest:'這個頁面還沒獲得使用 Google Drive 的許可。可以從頁面上方的權限選單開啟，或改用「複製 Markdown」。',
    approval_required:'需要你同意這個頁面使用 Google Drive。請在 claude.ai 開啟這個頁面後，再按一次「存到 Google Drive」。',
    blocked_by_policy:'你的組織政策不允許從這個頁面使用 Google Drive。請改用「複製 Markdown」或「下載 .md」。',
    server_unavailable:'Google Drive 暫時沒有回應。檔案可能已經建立，請先到 Drive 的 Obsidian 資料夾確認，沒有再按一次。',
    tool_error:'Google Drive 回報錯誤：'+(e&&e.message||'')
  };
  return map[c] || ('存到 Google Drive 沒有成功（'+(c||'未知錯誤')+'）。可以先用「複製 Markdown」保存內容。');
}
async function saveDrive(btn){
  if (!mcp){ msg('這個畫面無法連到 Google Drive。請在 claude.ai 開啟此頁，或改用「複製 Markdown」。','warn'); return; }
  if (!cur.title.trim()){ msg('請先寫標題，檔名會用它。','warn'); $('#f-title')?.focus(); return; }
  curMeta.created = curMeta.created || today();
  const sub = cur.mode==='essay' ? '20 文章' : (cur.status==='原子筆記' ? '10 原子筆記' : '00 收件匣');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '存檔中…';
  try {
    let parentId;
    try { parentId = await folderIdFor(sub); }
    catch(e){ if (e && e.code==='tool_error'){ lsSet(FKEY,{}); parentId = await folderIdFor(sub); } else throw e; }
    const r = await mcp.callTool(DRIVE,'create_file',{title:fileName(), parentId, contentMimeType:'text/markdown', disableConversionToGoogleType:true, textContent:toMarkdown()});
    const url = (r.payload && (r.payload.viewUrl||r.payload.webViewLink)) || '';
    curMeta.driveUrl = url || 'saved'; lsSet(LS,{cur,curId,curMeta});
    const libOk = await saveDb(true);
    msg(`已存到 Google Drive：Obsidian/${esc(sub)}/${esc(fileName())}` + (url?` ・ <a href="${esc(url)}" target="_blank" rel="noopener">在 Drive 開啟</a>`:'') +
      `<br>${libOk?'也已更新筆記庫。':''}電腦同步後就會出現在 Obsidian。再按一次會另存一份新檔。`,'ok',true);
  } catch(e){ lsSet(FKEY,{}); msg(driveErr(e),'err'); }
  finally { btn.disabled=false; btn.textContent = curMeta.driveUrl ? '再存一份到 Drive' : old; }
}
async function initDrive(){
  try { mcp = await window.claude?.use?.('mcp'); } catch { mcp=null; }
  if (!mcp){ $('#save-drive').disabled = true; $('#save-drive').title='在 claude.ai 開啟此頁才能存到 Google Drive'; }
}

/* downloads */
let dl=null;
async function initDl(){ try { dl = await window.claude?.use?.('downloads'); } catch { dl=null; } $('#dl-md').hidden = !dl; }
async function download(){
  try { await dl.save({filename:fileName(), data:new Blob([toMarkdown()],{type:'text/markdown'})}); msg('已下載。把檔案放進 Obsidian 筆記庫的資料夾即可。','ok'); }
  catch(e){ if (e && e.code==='declined') return; if (e && e.code==='rate_limited'){ msg('下載視窗已經開著，請先處理它。','warn'); return; } msg('無法下載（'+(e&&e.code||'錯誤')+'），請改用「複製 Markdown」。','err'); }
}

/* boot */
renderEditor(); renderPreview(); renderLib();
if (window.claude && window.claude.use){ initDb(); initDrive(); initDl(); }
else { localMode=true; notes = lsGet(LIB)||[]; libReady=true; setStatus('筆記庫只存在這個瀏覽器','warn'); renderLib(); $('#save-drive').disabled=true; }
})();
</script>
